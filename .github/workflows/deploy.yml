name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyDN64zo_bk0MtV9rC_FRHcqSElavyRepVU
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: tabsii-pos.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: tabsii-pos
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: tabsii-pos.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "584885539800"
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:584885539800:web:d7e87ce2bb48605dde58ad
          EXPO_PUBLIC_USE_EMULATOR: "false"
        run: npx expo export --platform web

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
